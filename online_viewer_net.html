<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Studio UI Builder (Smart Alignment Edition)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
            background-color: #1e1e2e;
            color: #cdd6f4;
            overflow: hidden;
        }
        .sidebar {
            width: 270px;
            background-color: #181825;
            padding: 12px;
            border-right: 1px solid #313244;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }
        h3 {
            font-size: 11px;
            color: #a6adc8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
        }
        .btn {
            background-color: #313244;
            color: #cdd6f4;
            border: 1px solid #45475a;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            text-align: center;
        }
        .btn:hover { background-color: #45475a; border-color: #585b70; }
        .btn-accent { background-color: #cba6f7; color: #11111b; font-weight: bold; border: none; }
        .btn-accent:hover { background-color: #f5c2e7; }
        .btn-primary { background-color: #89b4fa; color: #11111b; font-weight: bold; border: none; }
        .btn-primary:hover { background-color: #b4befe; }
        .btn-danger { background-color: #f38ba8; color: #11111b; border: none; }
        .btn-danger:hover { background-color: #eba0ac; }

        #canvas-container {
            flex-grow: 1;
            background-color: #11111b;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-image: radial-gradient(#313244 1px, transparent 1px);
            background-size: 20px 20px;
            user-select: none;
        }
        #screen-gui {
            width: 680px;
            height: 400px;
            background-color: #1e1e2e;
            border: 2px dashed #45475a;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #selection-box {
            position: absolute;
            border: 1px dashed #89b4fa;
            background-color: rgba(137, 180, 250, 0.15);
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        /* ガイド線 (Guide Lines) */
        .guide-line {
            position: absolute;
            pointer-events: none;
            z-index: 99;
            display: none;
        }
        .guide-line.vertical {
            width: 1px;
            top: 0; bottom: 0;
            border-left: 1px dashed #f5e0dc;
        }
        .guide-line.horizontal {
            height: 1px;
            left: 0; right: 0;
            border-top: 1px dashed #f5e0dc;
        }
        .guide-line.center-guide {
            border-color: #89b4fa;
        }

        .ui-element {
            position: absolute;
            cursor: move;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            border: 1px transparent solid;
            font-size: 14px;
            text-align: center;
            white-space: pre-wrap;
        }
        .ui-element.selected { outline: 1.5px solid #89b4fa; }
        .handle {
            position: absolute;
            width: 7px;
            height: 7px;
            background-color: #89b4fa;
            border: 1px solid #11111b;
            display: none;
            z-index: 10;
        }
        .ui-element.selected .handle { display: block; }
        .handle-tl { top: -4px; left: -4px; cursor: nwse-resize; }
        .handle-tr { top: -4px; right: -4px; cursor: nesw-resize; }
        .handle-bl { bottom: -4px; left: -4px; cursor: nesw-resize; }
        .handle-br { bottom: -4px; right: -4px; cursor: nwse-resize; }
        .handle-t { top: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle-b { bottom: -4px; left: 50%; transform: translateX(-50%); cursor: ns-resize; }
        .handle-l { top: 50%; left: -4px; transform: translateY(-50%); cursor: ew-resize; }
        .handle-r { top: 50%; right: -4px; transform: translateY(-50%); cursor: ew-resize; }

        .panel {
            width: 320px;
            background-color: #181825;
            border-left: 1px solid #313244;
            display: flex;
            flex-direction: column;
            padding: 12px;
            gap: 10px;
            overflow-y: auto;
        }
        .prop-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .prop-group label { font-size: 10px; color: #a6adc8; }
        .prop-group input, .prop-group select, .prop-group textarea {
            background-color: #313244;
            border: 1px solid #45475a;
            color: #cdd6f4;
            padding: 5px;
            border-radius: 4px;
            font-size: 11px;
        }
        .prop-row { display: flex; gap: 6px; }
        .prop-row > div { flex: 1; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background-color: #1e1e2e;
            border: 1px solid #45475a;
            border-radius: 8px;
            width: 420px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .preset-card {
            background: #313244;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .preset-card:hover { border-color: #89b4fa; background: #45475a; }

        #code-output {
            flex-grow: 1;
            background-color: #11111b;
            color: #a6e3a1;
            border: 1px solid #313244;
            border-radius: 4px;
            padding: 6px;
            font-family: 'Consolas', monospace;
            font-size: 10px;
            resize: none;
            white-space: pre;
            overflow-x: auto;
            min-height: 100px;
        }
    </style>
</head>
<body>

    <!-- 左 sidebar -->
    <div class="sidebar">
        <button class="btn btn-accent" style="padding: 8px;" onclick="openModal()">✨ プリセットを読み込む</button>

        <h3>UI Instance 追加</h3>
        <div class="btn-grid">
            <button class="btn" onclick="addElement('Frame')">+ Frame</button>
            <button class="btn" onclick="addElement('TextLabel')">+ TextLabel</button>
            <button class="btn" onclick="addElement('TextButton')">+ TextButton</button>
            <button class="btn" onclick="addElement('TextBox')">+ TextBox</button>
        </div>

        <h3>整列コマンド</h3>
        <div class="btn-grid-3">
            <button class="btn" onclick="alignSelected('left')">左揃え</button>
            <button class="btn" onclick="alignSelected('center-h')">水平中央</button>
            <button class="btn" onclick="alignSelected('right')">右揃え</button>
        </div>
        <div class="btn-grid-3" style="margin-top: 2px;">
            <button class="btn" onclick="alignSelected('top')">上揃え</button>
            <button class="btn" onclick="alignSelected('center-v')">垂直中央</button>
            <button class="btn" onclick="alignSelected('bottom')">下揃え</button>
        </div>

        <h3>サイズ一致</h3>
        <div class="btn-grid">
            <button class="btn" onclick="matchSize('height')">高さを揃える</button>
            <button class="btn" onclick="matchSize('width')">幅を揃える</button>
        </div>

        <h3>キャンバス整列</h3>
        <div class="btn-grid">
            <button class="btn" onclick="alignToCanvas('center')">画面の中央</button>
            <button class="btn" onclick="alignToCanvas('fill')">画面全体</button>
        </div>
    </div>

    <!-- Canvas -->
    <div id="canvas-container">
        <div id="screen-gui">
            <div id="selection-box"></div>
            <!-- Dynamic Guide Lines -->
            <div id="guide-v" class="guide-line vertical"></div>
            <div id="guide-h" class="guide-line horizontal"></div>
        </div>
    </div>

    <!-- 右 Property Panel -->
    <div class="panel">
        <h3>Properties</h3>
        <div class="prop-group">
            <label>Name</label>
            <input type="text" id="prop-name" oninput="updateSelectedElement()">
        </div>
        <div class="prop-group">
            <label>Text</label>
            <input type="text" id="prop-text" oninput="updateSelectedElement()">
        </div>
        
        <div class="prop-row">
            <div class="prop-group">
                <label>X Position (px)</label>
                <input type="number" id="prop-x" oninput="updateFromInputs()">
            </div>
            <div class="prop-group">
                <label>Y Position (px)</label>
                <input type="number" id="prop-y" oninput="updateFromInputs()">
            </div>
        </div>

        <div class="prop-row">
            <div class="prop-group">
                <label>Width (px)</label>
                <input type="number" id="prop-w" oninput="updateFromInputs()">
            </div>
            <div class="prop-group">
                <label>Height (px)</label>
                <input type="number" id="prop-h" oninput="updateFromInputs()">
            </div>
        </div>

        <div class="prop-row">
            <div class="prop-group">
                <label>BackgroundColor</label>
                <input type="color" id="prop-color" onchange="updateSelectedElement()">
            </div>
            <div class="prop-group">
                <label>TextColor</label>
                <input type="color" id="prop-text-color" onchange="updateSelectedElement()">
            </div>
        </div>

        <hr style="border-color: #313244;">

        <h3>Scripting (スクリプト仕込み)</h3>
        <div class="prop-group">
            <label>Event Type</label>
            <select id="prop-script-type" onchange="updateScriptType()">
                <option value="none">なし (No Event)</option>
                <option value="click">Activated (クリック時)</option>
                <option value="hover">MouseEnter / Leave (ホバー時)</option>
                <option value="custom">カスタム処理 (Custom Script)</option>
            </select>
        </div>
        <div class="prop-group">
            <label>Script Body (Luau)</label>
            <textarea id="prop-script-body" rows="4" style="font-family: monospace; font-size: 10px;" placeholder='print("Clicked!")' oninput="updateSelectedElement()"></textarea>
        </div>

        <div class="btn-grid" style="margin-top: 4px;">
            <button class="btn" onclick="duplicateSelected()">複製</button>
            <button class="btn btn-danger" onclick="deleteSelectedElements()">削除</button>
        </div>

        <hr style="border-color: #313244;">

        <h3>Luau Code Generator</h3>
        <div class="prop-group">
            <label>Mode</label>
            <select id="position-mode" onchange="generateLuauCode()">
                <option value="scale">Scale (レスポンシブ)</option>
                <option value="offset">Offset (ピクセル固定)</option>
            </select>
        </div>
        <textarea id="code-output" readonly></textarea>
        <button class="btn btn-primary" onclick="copyCode()">コードをコピー</button>
    </div>

    <!-- モーダル -->
    <div class="modal-overlay" id="preset-modal">
        <div class="modal">
            <h2 style="font-size: 15px;">プリセットを選択</h2>
            <div class="preset-card" onclick="loadPreset('shop')">
                <strong style="color: #89b4fa;">🛒 ショップ UI</strong>
                <p style="font-size: 10px; color: #a6adc8;">ウィンドウ、タイトル、購入ボタン、閉じるスクリプト付きボタン。</p>
            </div>
            <div class="preset-card" onclick="loadPreset('dialog')">
                <strong style="color: #a6e3a1;">💬 ダイヤログモーダル</strong>
                <p style="font-size: 10px; color: #a6adc8;">確認ダイアログと決定・キャンセルスクリプト。</p>
            </div>
            <button class="btn btn-danger" style="align-self: flex-end;" onclick="closeModal()">閉じる</button>
        </div>
    </div>

    <script>
        const screenGui = document.getElementById('screen-gui');
        const selectionBox = document.getElementById('selection-box');
        const guideV = document.getElementById('guide-v');
        const guideH = document.getElementById('guide-h');
        
        let elements = [];
        let selectedElements = [];
        let elementCount = 0;
        let isSelecting = false;
        let startSelectX = 0, startSelectY = 0;
        const SNAP_THRESHOLD = 5; // スナップ判定のピクセル距離

        function openModal() { document.getElementById('preset-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('preset-modal').style.display = 'none'; }

        function addElement(type, customData = {}) {
            elementCount++;
            const id = 'el_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const name = customData.name || (type + elementCount);

            const el = document.createElement('div');
            el.className = 'ui-element';
            el.id = id;

            const data = {
                id: id,
                type: type,
                name: name,
                x: customData.x !== undefined ? customData.x : 50,
                y: customData.y !== undefined ? customData.y : 50,
                width: customData.width || 130,
                height: customData.height || 45,
                bgColor: customData.bgColor || (type === 'Frame' ? '#313244' : (type === 'TextButton' ? '#89b4fa' : '#1e1e2e')),
                textColor: customData.textColor || (type === 'TextButton' ? '#11111b' : '#cdd6f4'),
                text: customData.text !== undefined ? customData.text : name,
                scriptType: customData.scriptType || (type === 'TextButton' ? 'click' : 'none'),
                scriptBody: customData.scriptBody || (type === 'TextButton' ? 'print("' + name + ' Clicked!")' : '')
            };

            el.dataset.info = JSON.stringify(data);

            const handles = ['tl', 't', 'tr', 'r', 'br', 'b', 'bl', 'l'];
            handles.forEach(h => {
                const handle = document.createElement('div');
                handle.className = `handle handle-${h}`;
                handle.dataset.direction = h;
                el.appendChild(handle);
            });

            applyStyles(el, data);
            makeDraggableAndResizable(el);

            el.addEventListener('click', (e) => {
                e.stopPropagation();
                if (e.shiftKey) toggleSelectElement(el);
                else selectSingleElement(el);
            });

            screenGui.appendChild(el);
            elements.push(el);
            selectSingleElement(el);
            generateLuauCode();
            return el;
        }

        function applyStyles(el, data) {
            el.style.left = data.x + 'px';
            el.style.top = data.y + 'px';
            el.style.width = data.width + 'px';
            el.style.height = data.height + 'px';
            el.style.backgroundColor = data.bgColor;
            el.style.color = data.textColor;
            
            let textNode = Array.from(el.childNodes).find(n => n.nodeType === Node.TEXT_NODE);
            if (textNode) {
                textNode.textContent = data.text;
            } else {
                el.appendChild(document.createTextNode(data.text));
            }
        }

        function selectSingleElement(el) {
            clearSelection();
            if (el) {
                selectedElements = [el];
                el.classList.add('selected');
                fillProperties(el);
            }
        }

        function toggleSelectElement(el) {
            const index = selectedElements.indexOf(el);
            if (index > -1) {
                selectedElements.splice(index, 1);
                el.classList.remove('selected');
            } else {
                selectedElements.push(el);
                el.classList.add('selected');
            }
            if (selectedElements.length > 0) fillProperties(selectedElements[selectedElements.length - 1]);
            else clearProperties();
        }

        function clearSelection() {
            selectedElements.forEach(el => el.classList.remove('selected'));
            selectedElements = [];
            clearProperties();
        }

        screenGui.addEventListener('mousedown', (e) => {
            if (e.target === screenGui) {
                clearSelection();
                isSelecting = true;
                const rect = screenGui.getBoundingClientRect();
                startSelectX = e.clientX - rect.left;
                startSelectY = e.clientY - rect.top;

                selectionBox.style.left = startSelectX + 'px';
                selectionBox.style.top = startSelectY + 'px';
                selectionBox.style.width = '0px';
                selectionBox.style.height = '0px';
                selectionBox.style.display = 'block';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isSelecting) return;
            const rect = screenGui.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;

            const x = Math.min(startSelectX, currentX);
            const y = Math.min(startSelectY, currentY);
            const w = Math.abs(currentX - startSelectX);
            const h = Math.abs(currentY - startSelectY);

            selectionBox.style.left = x + 'px';
            selectionBox.style.top = y + 'px';
            selectionBox.style.width = w + 'px';
            selectionBox.style.height = h + 'px';

            elements.forEach(el => {
                const data = JSON.parse(el.dataset.info);
                if (data.x >= x && data.x + data.width <= x + w &&
                    data.y >= y && data.y + data.height <= y + h) {
                    if (!selectedElements.includes(el)) {
                        selectedElements.push(el);
                        el.classList.add('selected');
                    }
                }
            });
        });

        document.addEventListener('mouseup', () => {
            if (isSelecting) {
                isSelecting = false;
                selectionBox.style.display = 'none';
                if (selectedElements.length > 0) fillProperties(selectedElements[0]);
            }
        });

        /* --- スマートガイド機能 --- */
        function hideGuides() {
            guideV.style.display = 'none';
            guideH.style.display = 'none';
        }

        function checkAlignmentSnapping(targetData) {
            hideGuides();
            const canvasW = screenGui.clientWidth;
            const canvasH = screenGui.clientHeight;

            let snappedX = targetData.x;
            let snappedY = targetData.y;
            let snappedW = targetData.width;
            let snappedH = targetData.height;

            const targetCenterX = targetData.x + targetData.width / 2;
            const targetCenterY = targetData.y + targetData.height / 2;

            // キャンバス中央の判定
            if (Math.abs(targetCenterX - canvasW / 2) < SNAP_THRESHOLD) {
                snappedX = (canvasW - targetData.width) / 2;
                guideV.style.left = (canvasW / 2) + 'px';
                guideV.style.display = 'block';
                guideV.classList.add('center-guide');
            } else { guideV.classList.remove('center-guide'); }

            if (Math.abs(targetCenterY - canvasH / 2) < SNAP_THRESHOLD) {
                snappedY = (canvasH - targetData.height) / 2;
                guideH.style.top = (canvasH / 2) + 'px';
                guideH.style.display = 'block';
                guideH.classList.add('center-guide');
            } else { guideH.classList.remove('center-guide'); }

            // 他要素との整列・高さ/幅一致判定
            elements.forEach(other => {
                if (selectedElements.includes(other)) return;
                const otherData = JSON.parse(other.dataset.info);
                const otherCenterX = otherData.x + otherData.width / 2;
                const otherCenterY = otherData.y + otherData.height / 2;

                // X軸方向（垂直ガイド線）
                if (Math.abs(targetData.x - otherData.x) < SNAP_THRESHOLD) {
                    snappedX = otherData.x;
                    guideV.style.left = otherData.x + 'px';
                    guideV.style.display = 'block';
                } else if (Math.abs((targetData.x + targetData.width) - (otherData.x + otherData.width)) < SNAP_THRESHOLD) {
                    snappedX = otherData.x + otherData.width - targetData.width;
                    guideV.style.left = (otherData.x + otherData.width) + 'px';
                    guideV.style.display = 'block';
                } else if (Math.abs(targetCenterX - otherCenterX) < SNAP_THRESHOLD) {
                    snappedX = otherCenterX - targetData.width / 2;
                    guideV.style.left = otherCenterX + 'px';
                    guideV.style.display = 'block';
                }

                // Y軸方向（水平ガイド線）
                if (Math.abs(targetData.y - otherData.y) < SNAP_THRESHOLD) {
                    snappedY = otherData.y;
                    guideH.style.top = otherData.y + 'px';
                    guideH.style.display = 'block';
                } else if (Math.abs((targetData.y + targetData.height) - (otherData.y + otherData.height)) < SNAP_THRESHOLD) {
                    snappedY = otherData.y + otherData.height - targetData.height;
                    guideH.style.top = (otherData.y + otherData.height) + 'px';
                    guideH.style.display = 'block';
                } else if (Math.abs(targetCenterY - otherCenterY) < SNAP_THRESHOLD) {
                    snappedY = otherCenterY - targetData.height / 2;
                    guideH.style.top = otherCenterY + 'px';
                    guideH.style.display = 'block';
                }

                // サイズ一致判定（高さ・幅）
                if (Math.abs(targetData.height - otherData.height) < SNAP_THRESHOLD) {
                    snappedH = otherData.height;
                }
                if (Math.abs(targetData.width - otherData.width) < SNAP_THRESHOLD) {
                    snappedW = otherData.width;
                }
            });

            return { x: snappedX, y: snappedY, width: snappedW, height: snappedH };
        }

        function makeDraggableAndResizable(el) {
            let startX, startY, startW, startH, startLeft, startTop;

            el.onmousedown = function(e) {
                if (e.target.classList.contains('handle')) {
                    e.preventDefault(); e.stopPropagation();
                    const dir = e.target.dataset.direction;
                    startX = e.clientX; startY = e.clientY;
                    startW = el.offsetWidth; startH = el.offsetHeight;
                    startLeft = el.offsetLeft; startTop = el.offsetTop;

                    document.onmousemove = function(e) {
                        let dx = e.clientX - startX, dy = e.clientY - startY;
                        let newW = startW, newH = startH, newL = startLeft, newT = startTop;

                        if (dir.includes('r')) newW = Math.max(10, startW + dx);
                        if (dir.includes('b')) newH = Math.max(10, startH + dy);
                        if (dir.includes('l')) { newW = Math.max(10, startW - dx); newL = startLeft + (startW - newW); }
                        if (dir.includes('t')) { newH = Math.max(10, startH - dy); newT = startTop + (startH - newH); }

                        let data = JSON.parse(el.dataset.info);
                        data.width = newW; data.height = newH; data.x = newL; data.y = newT;

                        // スナップ判定適用
                        const snapped = checkAlignmentSnapping(data);
                        data.x = snapped.x; data.y = snapped.y; data.width = snapped.width; data.height = snapped.height;

                        updateData(el, data);
                        fillProperties(el);
                        generateLuauCode();
                    };

                    document.onmouseup = function() { 
                        hideGuides();
                        document.onmousemove = null; document.onmouseup = null; 
                    };
                } else if (!e.shiftKey) {
                    e.preventDefault();
                    startX = e.clientX; startY = e.clientY;

                    const initialPositions = selectedElements.map(se => {
                        const d = JSON.parse(se.dataset.info);
                        return { el: se, x: d.x, y: d.y, width: d.width, height: d.height };
                    });

                    document.onmousemove = function(e) {
                        let dx = e.clientX - startX, dy = e.clientY - startY;

                        if (selectedElements.length === 1) {
                            const data = JSON.parse(el.dataset.info);
                            let targetData = { ...data, x: initialPositions[0].x + dx, y: initialPositions[0].y + dy };
                            const snapped = checkAlignmentSnapping(targetData);

                            data.x = snapped.x;
                            data.y = snapped.y;
                            updateData(el, data);
                        } else {
                            initialPositions.forEach(item => {
                                const data = JSON.parse(item.el.dataset.info);
                                data.x = item.x + dx;
                                data.y = item.y + dy;
                                updateData(item.el, data);
                            });
                        }

                        fillProperties(el);
                        generateLuauCode();
                    };

                    document.onmouseup = function() { 
                        hideGuides();
                        document.onmousemove = null; document.onmouseup = null; 
                    };
                }
            };
        }

        function alignSelected(type) {
            if (selectedElements.length < 2) return;
            const datas = selectedElements.map(el => JSON.parse(el.dataset.info));

            if (type === 'left') {
                const minX = Math.min(...datas.map(d => d.x));
                datas.forEach((d, i) => { d.x = minX; updateData(selectedElements[i], d); });
            } else if (type === 'right') {
                const maxX = Math.max(...datas.map(d => d.x + d.width));
                datas.forEach((d, i) => { d.x = maxX - d.width; updateData(selectedElements[i], d); });
            } else if (type === 'center-h') {
                const minX = Math.min(...datas.map(d => d.x));
                const maxX = Math.max(...datas.map(d => d.x + d.width));
                const midX = (minX + maxX) / 2;
                datas.forEach((d, i) => { d.x = midX - (d.width / 2); updateData(selectedElements[i], d); });
            } else if (type === 'top') {
                const minY = Math.min(...datas.map(d => d.y));
                datas.forEach((d, i) => { d.y = minY; updateData(selectedElements[i], d); });
            } else if (type === 'bottom') {
                const maxY = Math.max(...datas.map(d => d.y + d.height));
                datas.forEach((d, i) => { d.y = maxY - d.height; updateData(selectedElements[i], d); });
            } else if (type === 'center-v') {
                const minY = Math.min(...datas.map(d => d.y));
                const maxY = Math.max(...datas.map(d => d.y + d.height));
                const midY = (minY + maxY) / 2;
                datas.forEach((d, i) => { d.y = midY - (d.height / 2); updateData(selectedElements[i], d); });
            }
            fillProperties(selectedElements[0]);
            generateLuauCode();
        }

        function matchSize(dimension) {
            if (selectedElements.length < 2) return;
            const baseData = JSON.parse(selectedElements[0].dataset.info);

            selectedElements.forEach(el => {
                const data = JSON.parse(el.dataset.info);
                if (dimension === 'height') data.height = baseData.height;
                if (dimension === 'width') data.width = baseData.width;
                updateData(el, data);
            });
            fillProperties(selectedElements[0]);
            generateLuauCode();
        }

        function alignToCanvas(type) {
            if (selectedElements.length === 0) return;
            const cw = screenGui.clientWidth;
            const ch = screenGui.clientHeight;

            selectedElements.forEach(el => {
                const data = JSON.parse(el.dataset.info);
                if (type === 'center') {
                    data.x = (cw - data.width) / 2;
                    data.y = (ch - data.height) / 2;
                } else if (type === 'fill') {
                    data.x = 0; data.y = 0;
                    data.width = cw; data.height = ch;
                }
                updateData(el, data);
            });
            fillProperties(selectedElements[0]);
            generateLuauCode();
        }

        function updateData(el, data) {
            el.dataset.info = JSON.stringify(data);
            applyStyles(el, data);
        }

        function updateFromInputs() {
            if (selectedElements.length === 0) return;
            const el = selectedElements[0];
            const data = JSON.parse(el.dataset.info);

            data.x = parseInt(document.getElementById('prop-x').value) || 0;
            data.y = parseInt(document.getElementById('prop-y').value) || 0;
            data.width = parseInt(document.getElementById('prop-w').value) || 10;
            data.height = parseInt(document.getElementById('prop-h').value) || 10;

            updateData(el, data);
            generateLuauCode();
        }

        function updateSelectedElement() {
            if (selectedElements.length === 0) return;
            const el = selectedElements[0];
            const data = JSON.parse(el.dataset.info);

            data.name = document.getElementById('prop-name').value;
            data.text = document.getElementById('prop-text').value;
            data.bgColor = document.getElementById('prop-color').value;
            data.textColor = document.getElementById('prop-text-color').value;
            data.scriptType = document.getElementById('prop-script-type').value;
            data.scriptBody = document.getElementById('prop-script-body').value;

            updateData(el, data);
            generateLuauCode();
        }

        function updateScriptType() {
            if (selectedElements.length === 0) return;
            const el = selectedElements[0];
            const data = JSON.parse(el.dataset.info);
            const type = document.getElementById('prop-script-type').value;

            data.scriptType = type;
            if (type === 'click' && !data.scriptBody) {
                data.scriptBody = 'print("' + data.name + ' Clicked!")';
            } else if (type === 'hover' && !data.scriptBody) {
                data.scriptBody = 'print("Hovered!")';
            }

            document.getElementById('prop-script-body').value = data.scriptBody;
            updateData(el, data);
            generateLuauCode();
        }

        function fillProperties(el) {
            const data = JSON.parse(el.dataset.info);
            document.getElementById('prop-name').value = data.name;
            document.getElementById('prop-text').value = data.text;
            document.getElementById('prop-x').value = Math.round(data.x);
            document.getElementById('prop-y').value = Math.round(data.y);
            document.getElementById('prop-w').value = Math.round(data.width);
            document.getElementById('prop-h').value = Math.round(data.height);
            document.getElementById('prop-color').value = rgbToHex(el.style.backgroundColor);
            document.getElementById('prop-text-color').value = rgbToHex(el.style.color);
            document.getElementById('prop-script-type').value = data.scriptType || 'none';
            document.getElementById('prop-script-body').value = data.scriptBody || '';
        }

        function clearProperties() {
            document.getElementById('prop-name').value = '';
            document.getElementById('prop-text').value = '';
            document.getElementById('prop-x').value = '';
            document.getElementById('prop-y').value = '';
            document.getElementById('prop-w').value = '';
            document.getElementById('prop-h').value = '';
            document.getElementById('prop-script-type').value = 'none';
            document.getElementById('prop-script-body').value = '';
        }

        function deleteSelectedElements() {
            selectedElements.forEach(el => {
                elements = elements.filter(e => e !== el);
                el.remove();
            });
            clearSelection();
            generateLuauCode();
        }

        function duplicateSelected() {
            if (selectedElements.length === 0) return;
            const newSelections = [];
            selectedElements.forEach(el => {
                const data = JSON.parse(el.dataset.info);
                data.x += 15; data.y += 15;
                data.name += "_Copy";
                const newEl = addElement(data.type, data);
                newSelections.push(newEl);
            });
            clearSelection();
            newSelections.forEach(el => {
                selectedElements.push(el);
                el.classList.add('selected');
            });
        }

        function rgbToHex(rgb) {
            if (!rgb || rgb === 'transparent') return '#ffffff';
            let res = rgb.match(/\d+/g);
            if (!res) return '#ffffff';
            return "#" + ((1 << 24) + (parseInt(res[0]) << 16) + (parseInt(res[1]) << 8) + parseInt(res[2])).toString(16).slice(1);
        }

        function loadPreset(presetName) {
            screenGui.innerHTML = '<div id="selection-box"></div><div id="guide-v" class="guide-line vertical"></div><div id="guide-h" class="guide-line horizontal"></div>';
            elements = []; selectedElements = []; elementCount = 0;

            if (presetName === 'shop') {
                addElement('Frame', { name: 'ShopWindow', x: 140, y: 50, width: 400, height: 280, bgColor: '#181825' });
                addElement('TextLabel', { name: 'HeaderTitle', x: 160, y: 65, width: 360, height: 30, text: 'Item Shop' });
                addElement('TextButton', { name: 'CloseButton', x: 490, y: 60, width: 30, height: 30, text: 'X', bgColor: '#f38ba8', textColor: '#11111b', scriptType: 'click', scriptBody: 'ShopWindow.Visible = false' });
            } else if (presetName === 'dialog') {
                addElement('Frame', { name: 'DialogFrame', x: 160, y: 110, width: 360, height: 180, bgColor: '#1e1e2e' });
                addElement('TextLabel', { name: 'DialogText', x: 180, y: 130, width: 320, height: 50, text: 'Are you sure?' });
                addElement('TextButton', { name: 'ConfirmBtn', x: 190, y: 210, width: 130, height: 40, text: 'Confirm', bgColor: '#a6e3a1', textColor: '#11111b', scriptType: 'click', scriptBody: 'print("Confirmed!")\nDialogFrame.Visible = false' });
                addElement('TextButton', { name: 'CancelBtn', x: 360, y: 210, width: 130, height: 40, text: 'Cancel', bgColor: '#f38ba8', textColor: '#11111b', scriptType: 'click', scriptBody: 'DialogFrame.Visible = false' });
            }
            closeModal();
        }

        function generateLuauCode() {
            const mode = document.getElementById('position-mode').value;
            const canvasW = screenGui.clientWidth;
            const canvasH = screenGui.clientHeight;

            let code = `-- Roblox LocalScript (Generated)\n`;
            code += `local playerGui = game:GetService("Players").LocalPlayer:WaitForChild("PlayerGui")\n`;
            code += `local screenGui = Instance.new("ScreenGui")\n`;
            code += `screenGui.Name = "InteractiveGui"\n`;
            code += `screenGui.Parent = playerGui\n\n`;

            elements.forEach(el => {
                const data = JSON.parse(el.dataset.info);
                const v = data.name.replace(/[^a-zA-Z0-9]/g, "_");

                code += `-- [${data.name}]\n`;
                code += `local ${v} = Instance.new("${data.type}")\n`;
                code += `${v}.Name = "${data.name}"\n`;

                if (mode === 'scale') {
                    code += `${v}.Position = UDim2.new(${(data.x / canvasW).toFixed(3)}, 0, ${(data.y / canvasH).toFixed(3)}, 0)\n`;
                    code += `${v}.Size = UDim2.new(${(data.width / canvasW).toFixed(3)}, 0, ${(data.height / canvasH).toFixed(3)}, 0)\n`;
                } else {
                    code += `${v}.Position = UDim2.new(0, ${Math.round(data.x)}, 0, ${Math.round(data.y)})\n`;
                    code += `${v}.Size = UDim2.new(0, ${Math.round(data.width)}, 0, ${Math.round(data.height)})\n`;
                }

                if (data.type.includes('Text') || data.type === 'TextBox') {
                    code += `${v}.Text = "${data.text}"\n`;
                }
                code += `${v}.Parent = screenGui\n`;

                if (data.scriptType && data.scriptType !== 'none' && data.scriptBody) {
                    const lines = data.scriptBody.split('\n').map(l => '    ' + l).join('\n');
                    if (data.scriptType === 'click') {
                        code += `${v}.Activated:Connect(function()\n${lines}\nend)\n`;
                    } else if (data.scriptType === 'hover') {
                        code += `${v}.MouseEnter:Connect(function()\n${lines}\nend)\n`;
                    } else if (data.scriptType === 'custom') {
                        code += `${data.scriptBody}\n`;
                    }
                }
                code += `\n`;
            });

            document.getElementById('code-output').value = code;
        }

        function copyCode() {
            const copyText = document.getElementById("code-output");
            copyText.select();
            document.execCommand("copy");
            alert("Luauコードをコピーしました！");
        }
    </script>
